<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="13" fill="#0e0f13"/>
  <!-- Brand mark: the "≠" from "Ports ≠ Sockets", in accent purple -->
  <g stroke="#a879ff" stroke-width="7" stroke-linecap="round">
    <!-- the two "equals" bars -->
    <line x1="18" y1="26" x2="46" y2="26"/>
    <line x1="18" y1="38" x2="46" y2="38"/>
    <!-- the slash: a dark halo lifts it clear of the bars, then the purple stroke -->
    <line x1="21" y1="49" x2="43" y2="15" stroke="#0e0f13" stroke-width="12.5"/>
    <line x1="21" y1="49" x2="43" y2="15"/>
  </g>
</svg>
