<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ports ≠ Sockets — one connection, three names</title>
  <desc id="desc">A TCP connection from a public client host to nginx expands into its port, local kernel socket, and process file descriptor references.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="-8%" r="95%">
      <stop offset="0%" stop-color="#17151d"/>
      <stop offset="55%" stop-color="#0e0f13"/>
    </radialGradient>
    <style>
      .serif { font-family: "IBM Plex Serif", Georgia, serif; }
      .mono { font-family: "IBM Plex Mono", monospace; }
      .label { font-size: 13px; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="76" cy="58" r="8" fill="#a879ff"/>
  <circle cx="76" cy="58" r="8" fill="none" stroke="#a879ff" stroke-opacity="0.35" stroke-width="7"/>
  <text x="98" y="67" class="serif" fill="#ece9e3" font-size="27">Ports <tspan fill="#a879ff" font-style="italic">≠</tspan> Sockets</text>

  <text x="72" y="142" class="serif" fill="#ece9e3" font-size="51">One connection, <tspan fill="#a879ff" font-style="italic">three references.</tspan></text>

  <!-- the connection is the primary object -->
  <g>
    <rect x="72" y="184" width="1056" height="104" rx="14" fill="#191a20" stroke="#a879ff" stroke-width="2"/>
    <text x="100" y="218" class="mono label" fill="#7b7870">CLIENT HOST</text>
    <text x="100" y="251" class="mono" fill="#ece9e3" font-size="21">203.0.113.55:<tspan fill="#dca24f">54321</tspan></text>

    <line x1="390" y1="239" x2="825" y2="239" stroke="#a879ff" stroke-width="3"/>
    <circle cx="615" cy="239" r="5" fill="#a879ff"/>
    <path d="M825 239 l-12 -9 v18 z" fill="#a879ff"/>
    <text x="586" y="220" class="mono" fill="#63c58c" font-size="13">ESTAB</text>

    <text x="1098" y="218" class="mono label" fill="#7b7870" text-anchor="end">NGINX</text>
    <text x="1098" y="251" class="mono" fill="#ece9e3" font-size="21" text-anchor="end">198.51.100.80:<tspan fill="#dca24f">80</tspan></text>
  </g>

  <!-- the expanded horizontal reference journey -->
  <g>
    <rect x="72" y="310" width="326" height="248" rx="12" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="72" y="310" width="326" height="5" rx="2.5" fill="#dca24f"/>
    <text x="94" y="349" class="mono label" fill="#7b7870">REMOTE</text>
    <text x="376" y="349" class="serif" fill="#dca24f" font-size="22" text-anchor="end">Port</text>
    <text x="94" y="392" class="serif" fill="#ece9e3" font-size="27">Addressed on the wire</text>
    <text x="94" y="436" class="mono" fill="#a7a49c" font-size="17">203.0.113.55:<tspan fill="#dca24f">54321</tspan></text>
    <text x="224" y="471" class="mono" fill="#dca24f" font-size="18">↓</text>
    <text x="94" y="510" class="mono" fill="#a7a49c" font-size="17">198.51.100.80:<tspan fill="#dca24f">80</tspan></text>

    <text x="414" y="444" class="mono" fill="#7b7870" font-size="22">→</text>

    <rect x="438" y="310" width="326" height="248" rx="12" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="438" y="310" width="326" height="5" rx="2.5" fill="#63c58c"/>
    <text x="460" y="349" class="mono label" fill="#7b7870">KERNEL</text>
    <text x="742" y="349" class="serif" fill="#63c58c" font-size="22" text-anchor="end">Socket</text>
    <text x="460" y="392" class="serif" fill="#ece9e3" font-size="27">socket:[12346]</text>
    <text x="460" y="432" class="mono" fill="#a7a49c" font-size="15">203.0.113.55  ·  54321</text>
    <text x="460" y="466" class="mono" fill="#a7a49c" font-size="15">198.51.100.80  ·  <tspan fill="#dca24f">80</tspan></text>
    <text x="460" y="500" class="mono" fill="#63c58c" font-size="15">TCP</text>

    <text x="780" y="444" class="mono" fill="#7b7870" font-size="22">→</text>

    <rect x="804" y="310" width="324" height="248" rx="12" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="804" y="310" width="324" height="5" rx="2.5" fill="#6f9fd8"/>
    <text x="826" y="349" class="mono label" fill="#7b7870">NGINX</text>
    <text x="1106" y="349" class="serif" fill="#6f9fd8" font-size="22" text-anchor="end">File descriptor</text>
    <text x="826" y="392" class="serif" fill="#ece9e3" font-size="27">fd 4</text>
    <text x="826" y="432" class="mono" fill="#a7a49c" font-size="15">nginx pid 1234</text>
    <text x="826" y="466" class="mono" fill="#6f9fd8" font-size="15">fd table [4]</text>
    <text x="826" y="500" class="mono" fill="#63c58c" font-size="15">→ socket:[12346]</text>
  </g>
</svg>
