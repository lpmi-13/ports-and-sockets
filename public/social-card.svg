<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ports ≠ Sockets — one connection, three names</title>
  <desc id="desc">On the wire it is a port, in the kernel it is a socket, and in the process it is a file descriptor — three references to one connection.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="-8%" r="95%">
      <stop offset="0%" stop-color="#17151d"/>
      <stop offset="55%" stop-color="#0e0f13"/>
    </radialGradient>
    <style>
      .serif { font-family: "IBM Plex Serif", Georgia, serif; }
      .mono  { font-family: "IBM Plex Mono", monospace; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- brand: violet connection dot + serif wordmark -->
  <circle cx="86" cy="72" r="9" fill="#a879ff"/>
  <circle cx="86" cy="72" r="9" fill="none" stroke="#a879ff" stroke-opacity="0.35" stroke-width="7"/>
  <text x="108" y="81" class="serif" fill="#ece9e3" font-size="28">Ports <tspan fill="#a879ff" font-style="italic">≠</tspan> Sockets</text>

  <!-- headline -->
  <text x="72" y="168" class="serif" fill="#ece9e3" font-size="58">One connection, <tspan fill="#a879ff" font-style="italic">three names.</tspan></text>

  <!-- three lenses, colour-coded like the site -->
  <!-- WIRE · port (amber) -->
  <g class="mono">
    <rect x="72" y="216" width="1056" height="112" rx="14" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="74" y="218" width="5" height="108" rx="2.5" fill="#dca24f"/>
    <text x="102" y="258" font-size="19" fill="#dca24f">WIRE<tspan fill="#7b7870">  ·  tcpdump  ·  names it by its </tspan>PORT</text>
    <text x="102" y="296" font-size="24" fill="#7b7870">192.168.1.10:<tspan fill="#dca24f">80</tspan> → 10.0.0.55:<tspan fill="#dca24f">54321</tspan></text>
  </g>
  <!-- converging into the socket -->
  <path d="M600 330 l10 0 -5 8 z" fill="#a879ff"/>

  <!-- KERNEL · socket (sage) -->
  <g class="mono">
    <rect x="72" y="348" width="1056" height="112" rx="14" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="74" y="350" width="5" height="108" rx="2.5" fill="#63c58c"/>
    <text x="102" y="390" font-size="19" fill="#63c58c">KERNEL<tspan fill="#7b7870">  ·  ss  ·  is the socket</tspan></text>
    <text x="102" y="428" font-size="24" fill="#7b7870">ESTAB 192.168.1.10:80 10.0.0.55:54321  <tspan fill="#63c58c">socket:[12346]</tspan></text>
  </g>
  <path d="M600 480 l10 0 -5 -8 z" fill="#a879ff"/>

  <!-- PROCESS · file descriptor (slate blue) -->
  <g class="mono">
    <rect x="72" y="480" width="1056" height="112" rx="14" fill="#191a20" stroke="#2c2d35" stroke-width="2"/>
    <rect x="74" y="482" width="5" height="108" rx="2.5" fill="#6f9fd8"/>
    <text x="102" y="522" font-size="19" fill="#6f9fd8">PROCESS<tspan fill="#7b7870">  ·  lsof  ·  names it by its </tspan>fd</text>
    <text x="102" y="560" font-size="24" fill="#6f9fd8">fd 4 <tspan fill="#7b7870">→</tspan> <tspan fill="#63c58c">socket:[12346]</tspan><tspan fill="#7b7870">   read(4) / write(4)</tspan></text>
  </g>
</svg>
