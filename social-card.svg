<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Ports are not sockets</title>
  <desc id="desc">A visual guide to the distinction in the Linux networking stack</desc>
  <rect width="1200" height="630" fill="#f5f3ed"/>
  <rect x="72" y="64" width="82" height="48" fill="#172225"/>
  <text x="86" y="96" fill="#d7ff57" font-family="monospace" font-size="24" font-weight="700">P≠S</text>
  <text x="72" y="238" fill="#172225" font-family="Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-4">A port is a number.</text>
  <text x="72" y="342" fill="#5f80ff" font-family="Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-4">A socket is the endpoint.</text>
  <line x1="72" y1="420" x2="1128" y2="420" stroke="#ccd0c9" stroke-width="2"/>
  <text x="72" y="500" fill="#687275" font-family="monospace" font-size="27">LINUX NETWORKING, VISUALLY</text>
  <circle cx="1075" cy="500" r="32" fill="#d7ff57"/>
  <circle cx="1075" cy="500" r="12" fill="#172225"/>
</svg>
