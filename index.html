<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ports ≠ Sockets — one connection, three names</title>
  <meta name="description" content="Explore nginx TCP connections as expandable lanes from remote hosts to the server, then follow each connection through its port, kernel socket, and file descriptor references." />
  <meta name="theme-color" content="#0e0f13" />
  <link rel="canonical" href="https://ports-and-sockets.netlify.app/" />

  <!-- social / Open Graph previews -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ports-and-sockets.netlify.app/" />
  <meta property="og:site_name" content="Ports ≠ Sockets" />
  <meta property="og:title" content="Ports ≠ Sockets — one connection, three names" />
  <meta property="og:description" content="Open one nginx connection and follow its three references: port on the wire, socket in the kernel, and file descriptor in the process." />
  <meta property="og:image" content="https://ports-and-sockets.netlify.app/social-card.svg" />
  <meta property="og:image:alt" content="One connection, three names — a port on the wire, a socket in the kernel, a file descriptor in the process." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ports ≠ Sockets — one connection, three names" />
  <meta name="twitter:description" content="Explore each nginx connection as a remote endpoint, kernel socket, and process-local file descriptor." />
  <meta name="twitter:image" content="https://ports-and-sockets.netlify.app/social-card.svg" />

  <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-word">Ports <i>≠</i> Sockets</span>
    </div>
    <div class="connection-status">
      <span class="connection-status-dot" aria-hidden="true"></span>
      <span id="server-count" role="status" aria-live="polite" aria-atomic="true"></span>
    </div>
  </header>

  <main id="stage" tabindex="0" aria-label="Active TCP connections from remote hosts to nginx. Open a connection to see its port, kernel socket, and nginx file descriptor references.">
    <div id="req-label" aria-live="polite"></div>
    <div id="scenario">
      <strong>One TCP connection.</strong>
      Outside the host it is addressed by IP and ports. The kernel owns a socket. nginx holds a file descriptor.
    </div>

    <section id="connections-stage" aria-labelledby="connections-title">
      <header class="connections-head">
        <div class="connections-intro">
          <span class="eyebrow">Active TCP connections</span>
          <h1 id="connections-title">Remote hosts → nginx</h1>
          <p>Open a connection to follow its three references.</p>
        </div>
        <div class="server-summary" aria-label="nginx server endpoint">
          <span class="server-icon" aria-hidden="true"></span>
          <span class="server-summary-copy">
            <span>nginx server</span>
            <strong>192.168.1.10:<b>80</b></strong>
          </span>
        </div>
      </header>
      <div id="connection-list" class="connection-list" role="list"></div>
    </section>
  </main>

  <footer id="controlbar">
    <div id="controls">
      <button class="step-btn accent" id="accept">＋&nbsp;Accept a client</button>
      <button class="step-btn" id="close">Close selected</button>
      <button class="step-btn" id="reset">↺&nbsp;Reset</button>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
