<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0e0f13"/>
  <!-- the socket table: rows sharing a port; the matched row is sage,
       and a violet arrival dot rests on it (the packet that just landed) -->
  <rect x="6" y="8"  width="20" height="4.4" rx="1.4" fill="#2c2d35"/>
  <rect x="6" y="14" width="20" height="4.4" rx="1.4" fill="#63c58c"/>
  <rect x="6" y="20" width="20" height="4.4" rx="1.4" fill="#2c2d35"/>
  <!-- the shared port, amber, at the left edge of every row -->
  <rect x="6" y="8" width="3.2" height="16.4" rx="1" fill="#dca24f"/>
  <!-- the violet packet arriving on the matched socket -->
  <circle cx="23" cy="16.2" r="3.6" fill="#a879ff"/>
  <circle cx="23" cy="16.2" r="3.6" fill="none" stroke="#a879ff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
