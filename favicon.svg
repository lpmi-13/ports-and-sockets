<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0a0f1e"/>
  <!-- a socket table: three rows sharing a port; the matched one is bright -->
  <rect x="12" y="14" width="40" height="9" rx="2" fill="#26325a"/>
  <rect x="12" y="27" width="40" height="9" rx="2" fill="#2fb87f"/>
  <rect x="12" y="40" width="40" height="9" rx="2" fill="#26325a"/>
  <!-- the shared port number, orange, at the left edge of every row -->
  <rect x="12" y="14" width="7" height="35" rx="2" fill="#e69f00"/>
  <rect x="12" y="27" width="7" height="9" fill="#e69f00"/>
</svg>
